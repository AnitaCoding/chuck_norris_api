<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">
    <title>Los profetas de Chuck Norris</title>
</head>
<body>
    <div class="container-fluid vh-100">
        <header>
        <h1 class="text-center">Chuck Norris era Dios</h1>
        </header>
        <section>

            <div class="card text-center">
                <div class="card-body">
                    <h5 class="card-title">Por categoría</h5>
                    <p class="card-text">Elige una categoría</p>
                    <select name="choose-category" id="choose-category" class="form-select form-select-sm" aria-label="Elige una categoría">
                    </select>                
                </div>
            </div>

            <div>
                <p id="category-joke"></p>
            </div>
            

            <div class="card text-center">
                <div class="card-body">
                    <h5 class="card-title">Prueba suerte</h5>
                    <p class="card-text">Toca el botón para un chiste aleatorio</p>
                    <button id="button-random" class="btn btn-primary">Deja que Chuck te sorprenda</button>
                </div>
            </div>

            <div>
                <p id="random-joke"></p>
            </div>


        </section>
        <footer>
            <small>Chuck Norris approves this</small>

        </footer>

    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="js/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Bowlby+One+SC&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <title>Apocalipsis Norris</title>
</head>
<body>
    <div class="container-fluid vh-100">
        <header>
            <h1 class="text-center">Apocalipsis Norris</h1>
        </header>
        <section>
            <ul class="nav nav-tabs" id="myTab" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="random-tab" data-bs-toggle="tab" data-bs-target="#random-pane" type="button" role="tab" aria-controls="random-pane" aria-selected="true">Aleatorio</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="category-tab" data-bs-toggle="tab" data-bs-target="#category-pane" type="button" role="tab" aria-controls="category-pane" aria-selected="false">Por categoría</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="favourite-tab" data-bs-toggle="tab" data-bs-target="#favourite-pane" type="button" role="tab" aria-controls="favourite-pane" aria-selected="false">Favoritos</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="history-tab" data-bs-toggle="tab" data-bs-target="#history-pane" type="button" role="tab" aria-controls="history-pane" aria-selected="false">Historial</button>
                </li>
            </ul>
            <div class="tab-content">
                <div class="tab-pane fade show active" id="random-pane" role="tabpanel" aria-labelledby="random-tab">
                    <div class="card text-center">
                        <div class="card-body">
                            <h5 class="card-title">Prueba suerte</h5>
                            <p class="card-text">Toca el botón para un chiste aleatorio</p>
                            <button id="button-random" class="btn btn-primary">Deja que Chuck te sorprenda</button>
                        </div>
                    </div>                
                </div>

                <div class="tab-pane fade" id="category-pane" role="tabpanel" aria-labelledby="category-tab">
                    <div class="card text-center">
                        <div class="card-body">
                            <h5 class="card-title">Por categoría</h5>
                            <p class="card-text">Elige una categoría</p>
                            <select name="choose-category" id="choose-category" class="form-select form-select-sm" aria-label="Elige una categoría"></select>                
                        </div>
                    </div>
                </div>
            </div>

            <div>
                <p id="joke"></p>
                <button type="button" class="btn">Guardar<span><i class="fa-regular fa-bookmark"></i></span></button>
                <button type="button" class="btn">Copiar<span><i class="fa-regular fa-clipboard"></i></span></button>
                <button type="button" class="btn">Compartir<span><i class="fa-solid fa-share-nodes"></i></span></button>
            </div>
        </section>
        <footer>
            <small>Chuck Norris approves this</small>

        </footer>

    </div>
    <script src="https://kit.fontawesome.com/deb332e293.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="js/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Bowlby+One+SC&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <title>Apocalipsis Norris</title>
</head>
<body>
    <div class="container-fluid vh-100">
        <header>
            <h1 class="text-center">Apocalipsis Norris</h1>
        </header>
        <section>
            <ul class="nav nav-tabs" id="myTab" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="random-tab" data-bs-toggle="tab" data-bs-target="#random-pane" type="button" role="tab" aria-controls="random-pane" aria-selected="true">Aleatorio</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="category-tab" data-bs-toggle="tab" data-bs-target="#category-pane" type="button" role="tab" aria-controls="category-pane" aria-selected="false">Por categoría</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="favourite-tab" data-bs-toggle="tab" data-bs-target="#favourite-pane" type="button" role="tab" aria-controls="favourite-pane" aria-selected="false">Favoritos</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="history-tab" data-bs-toggle="tab" data-bs-target="#history-pane" type="button" role="tab" aria-controls="history-pane" aria-selected="false">Historial</button>
                </li>
            </ul>
            <div class="tab-content">
                <!--RANDOME-->
                <div class="tab-pane fade show active" id="random-pane" role="tabpanel" aria-labelledby="random-tab">
                    <div class="text-center div-get-joke">
                        <h2>Prueba suerte</h2>
                        <p>Toca el botón para un chiste aleatorio</p>
                        <button type="button" id="button-random" class="btn btn-primary">Deja que Chuck te sorprenda</button>
                    </div>
                    <div id="random-joke-container" class="div-joke"></div>              
                </div>
                <!--POR CATEGORÍA-->
                <div class="tab-pane fade" id="category-pane" role="tabpanel" aria-labelledby="category-tab">
                    <div class="text-center div-get-joke">
                        <h2>Por categoría</h2>
                        <p>Elige una categoría</p>
                        <select name="choose-category" id="choose-category" class="form-select form-select-sm" aria-label="Elige una categoría"></select>                
                        <button id="button-category" style="display: none" class="btn btn-primary">Un chiste más</button>
                    </div>
                    <div id="category-joke-container" class="div-joke"></div>
                </div>
                <!--FAVORITOS-->
                <div class="tab-pane fade" id="favourite-pane" role="tabpanel" aria-labelledby="favourite-tab">
                    <div class="text-center div-get-joke">
                        <h2>Favoritos</h2>
                        <div id="fav-container"></div>
                    </div>
                </div>
                <!--HISTORIAL-->
                <div class="tab-pane fade" id="history-pane" role="tabpanel" aria-labelledby="history-tab">
                    <div class="text-center div-get-joke">
                        <h2>Vistos recientemente</h2>
                        <button id="delete-history" class="btn btn-primary">Eliminar historial</button>
                        <div id="history-container"></div>
                    </div>
                </div>
            </div>
        </section>
        <footer>
            <small>Chuck Norris approves this</small>
        </footer>

    </div>
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="toast-div"
            class="toast"
            role="status"
            aria-live="polite"
            aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body">
                </div>
                <button type="button"
                        class="btn-close btn-close-white me-2 m-auto"
                        data-bs-dismiss="toast"
                        aria-label="Cerrar"></button>
            </div>
        </div>
    </div>
    <script src="https://kit.fontawesome.com/deb332e293.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="js/app.js"></script>
</body>
</html>
